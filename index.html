<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nimble Station — Activity Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="mark">NS</div>
      <div>
        <h1>Nimble Station</h1>
        <p class="tag">Team activity board</p>
      </div>
    </div>
    <p class="updated" id="updated">Updated —</p>
  </header>

  <main id="board" class="board">
    <p class="loading">Loading board…</p>
  </main>

  <footer>
    <p>Private team board. Do not put secrets, passwords, or personal emails here.</p>
    <p>Source of truth split: GQueues = next actions · Tom’s Planner = sequence · Obsidian = evidence.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
